name: OpenSpec latest canary

# Continuous-assurance check: does the NEWEST published OpenSpec still validate our governance
# corpus? This complements the Dependabot bump PR (which only tests the version it bumps *to*) by
# testing `@latest` on a schedule, so a breaking upstream release is caught even before — or
# without — a bump PR being merged. On failure it opens (once) a tracking issue and the run fails,
# which emails the maintainer via the normal Actions notification.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  validate-latest:
    name: Validate corpus against OpenSpec @latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenSpec @latest
        run: npm install -g @fission-ai/openspec@latest --prefix ~/.local
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Report installed version
        run: ~/.local/bin/openspec --version

      - name: Validate corpus (strict) against @latest
        run: ~/.local/bin/openspec validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Open a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          # Ensure the dedupe label exists. READ FIRST, create only on a miss. The old form was
          # `gh label create … 2>/dev/null || true`, which made an auth failure indistinguishable
          # from "already exists" (§4.5) — and a label that silently failed to be created breaks
          # the dedupe below with nothing to say so.
          if gh api "repos/${repo}/labels/openspec-canary" >/dev/null 2>&1; then
            echo "label openspec-canary: present"
          else
            gh api -X POST "repos/${repo}/labels" \
              -f name=openspec-canary \
              -f color=b60205 \
              -f description="Weekly OpenSpec @latest compatibility canary"
            echo "label openspec-canary: created"
          fi

          # ⚠ /issues RETURNS PULL REQUESTS TOO. Without the `.pull_request == null` filter an open
          # PR carrying the label would count as an existing issue, and the canary would silently
          # stop opening the issues it exists to open (§4.6).
          open=$(gh api "repos/${repo}/issues?labels=openspec-canary&state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | length')
          if [ "$open" = "0" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            body="The weekly OpenSpec canary failed: 'openspec validate --all --strict' against @fission-ai/openspec@latest no longer passes. A newer OpenSpec release may be incompatible with the governance corpus. Investigate before bumping the pinned version in package.json. Run: ${run_url}"
            # ⚠ `-f labels=…` sends a STRING and is rejected; the array form is `-f 'labels[]=…'`.
            gh api -X POST "repos/${repo}/issues" \
              -f title="OpenSpec @latest broke corpus validation" \
              -f body="$body" \
              -f 'labels[]=openspec-canary'
          else
            echo "An openspec-canary issue is already open; not duplicating."
          fi
